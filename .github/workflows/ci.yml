name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tooling
        run: python -m pip install -e . pytest==9.1.1 coverage==7.13.3
      - name: Compile sources
        run: python -m compileall -q src tests examples
      - name: Run tests with coverage
        run: |
          python -W error::ResourceWarning -m coverage run -m pytest -q
          python -m coverage report --fail-under=90
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify installed wheel
        run: |
          python -m venv /tmp/secure-ops-gateway-wheel
          /tmp/secure-ops-gateway-wheel/bin/python -m pip install dist/*.whl
          /tmp/secure-ops-gateway-wheel/bin/python -c "import secure_ops_gateway; assert secure_ops_gateway.__version__ == '0.1.1'"

  mcp-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install official MCP compatibility tooling
        run: python -m pip install -e . pytest==9.1.1 mcp==2.2.0
      - name: Test official MCP Python SDK compatibility
        run: python -m pytest -q tests/integration
