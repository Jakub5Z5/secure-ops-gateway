name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tooling
        run: python -m pip install -e . pytest==9.1.1 coverage==7.13.3
      - name: Compile sources
        run: python -m compileall -q src tests examples
      - name: Run tests with line and branch coverage
        run: |
          python -W error::ResourceWarning -m coverage run --branch -m pytest -q
          python -m coverage json -o coverage.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("coverage.json").read_text())
          totals = report["totals"]

          def line_percent(summary):
              statements = summary["num_statements"]
              if statements == 0:
                  return 100.0
              return 100.0 * summary["covered_lines"] / statements

          global_line = line_percent(totals)
          if global_line < 90.0:
              raise SystemExit(
                  f"global line coverage {global_line:.2f}% is below 90.00%"
              )

          critical_floors = {
              "authorization.py": 87.0,
              "audit.py": 87.0,
              "registry.py": 89.0,
              "operation_guard.py": 91.0,
              "executor.py": 90.0,
              "paths.py": 90.0,
          }
          for suffix, floor in critical_floors.items():
              matches = [
                  data["summary"]
                  for name, data in report["files"].items()
                  if name.endswith("/" + suffix) or name == suffix
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected exactly one coverage entry for {suffix}, "
                      f"found {len(matches)}"
                  )
              current = line_percent(matches[0])
              if current < floor:
                  raise SystemExit(
                      f"{suffix} line coverage {current:.2f}% "
                      f"is below {floor:.2f}%"
                  )

          branches = totals.get("num_branches", 0)
          covered_branches = totals.get("covered_branches", 0)
          if branches <= 0:
              raise SystemExit("branch coverage was not collected")
          branch_percent = 100.0 * covered_branches / branches
          print(f"global line coverage: {global_line:.2f}%")
          print(
              "global branch coverage: "
              f"{branch_percent:.2f}% "
              f"({covered_branches}/{branches})"
          )
          PY
          python -m coverage report --fail-under=0
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify installed wheel
        run: |
          python -m venv /tmp/secure-ops-gateway-wheel
          /tmp/secure-ops-gateway-wheel/bin/python -m pip install dist/*.whl
          /tmp/secure-ops-gateway-wheel/bin/python -c "import importlib.metadata as metadata, secure_ops_gateway; assert secure_ops_gateway.__version__ == '0.2.0'; assert metadata.version('secure-ops-gateway') == secure_ops_gateway.__version__"

  mcp-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install official MCP compatibility tooling
        run: python -m pip install -e . pytest==9.1.1 mcp==2.2.0
      - name: Test official MCP Python SDK compatibility
        run: python -m pytest -q tests/integration
